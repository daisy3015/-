<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파마브로스 · 전제품 개발 및 발주 관리 대시보드</title>
<style>
/* ═══════════ TYPOGRAPHY & TOKENS ═══════════ */
:root{
  /* Pretendard → Noto Sans KR → 시스템 순으로 폴백 (설치돼 있으면 자동 적용) */
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,
         "Apple SD Gothic Neo","Segoe UI","Malgun Gothic",system-ui,sans-serif;
  --num:"Pretendard Variable",Pretendard,"SF Mono",ui-monospace,var(--font);
  --ls:-0.02em;
  --r:14px; --r2:11px; --r3:9px; --r4:7px;
  --sbw:262px;
}
[data-theme="light"]{
  --bg:#f5f7fb;
  --bgimg:
    radial-gradient(900px 460px at 10% -16%, #e8eefd 0%, rgba(245,247,251,0) 56%),
    radial-gradient(760px 420px at 96% -6%, #f4ecfc 0%, rgba(245,247,251,0) 52%),
    radial-gradient(700px 440px at 88% 106%, #e8f5f3 0%, rgba(245,247,251,0) 50%),
    linear-gradient(178deg,#fbfcff 0%,#f5f7fb 44%,#f1f4fa 100%);
  --s1:#fff; --s2:#f9fafd; --s3:#f0f3f9; --s4:#e6ebf4;
  --panel:#fff;
  --bd:#e4e9f2; --bd2:#cdd6e5;
  /* 대비 강화 */
  --tx:#1e2532; --tx2:#576174; --tx3:#8b94a6;
  --ac:#5f86e0; --acs:#eaf1fd; --acd:#3560b8;
  --pp:#9b7ada; --pps:#f1ebfb; --ppd:#6a4bb0;
  --or:#e2924f; --ors:#fdf2e8; --ord:#a9631f;
  --wn:#d9ab35; --wns:#fdf7e4; --wnd:#8d6b0c;
  --ok:#4fb98a; --oks:#e8f7f0; --okd:#237a55;
  --dn:#e17a8c; --dns:#fdecef; --dnd:#ad3d54;
  --cy:#5cb6c4; --cys:#e8f5f8; --cyd:#22757f;
  --grid:#ecf0f7; --gridq:#dbe2ee; --zebra:#fbfcfe;
  --sh:0 1px 2px rgba(30,37,50,.04),0 6px 20px -14px rgba(30,37,50,.16);
  --shl:0 4px 16px -8px rgba(30,37,50,.18);
  --ov:rgba(22,27,38,.4);
  /* 사이드바 : 화이트 어드민 */
  --sb:#fff; --sb2:#f7f9fc; --sb3:#eef2f9; --sbbd:#e6ebf3;
  --sbtx:#1e2532; --sbtx2:#5b6578; --sbtx3:#98a1b3;
}
[data-theme="dusk"]{
  --bg:#161a23;
  --bgimg:
    radial-gradient(900px 460px at 10% -16%,#232a3c 0%,rgba(22,26,35,0) 56%),
    radial-gradient(760px 420px at 96% -6%,#2a2540 0%,rgba(22,26,35,0) 52%),
    linear-gradient(178deg,#1b1f2b 0%,#161a23 46%,#14171f 100%);
  --s1:#1f2430; --s2:#242a38; --s3:#2b3241; --s4:#353d4e;
  --panel:#1f2430;
  --bd:#2e3543; --bd2:#414a5d;
  --tx:#eef1f7; --tx2:#aab3c4; --tx3:#7c8598;
  --ac:#8dabf0; --acs:#28304a; --acd:#adc4f7;
  --pp:#bda6ea; --pps:#332c4b; --ppd:#cebcf2;
  --or:#eeb188; --ors:#43342a; --ord:#f6c9ab;
  --wn:#e5c982; --wns:#40381f; --wnd:#f1dca4;
  --ok:#87d2ae; --oks:#243c32; --okd:#a8e0c4;
  --dn:#eda4b1; --dns:#402a30; --dnd:#f6c3cb;
  --cy:#8fd0da; --cys:#25373c; --cyd:#ade1e9;
  --grid:#272e3b; --gridq:#333b4b; --zebra:#1f242f;
  --sh:0 1px 2px rgba(0,0,0,.2),0 8px 24px -16px rgba(0,0,0,.5);
  --shl:0 6px 20px -10px rgba(0,0,0,.55);
  --ov:rgba(8,10,15,.62);
  --sb:#1b1f29; --sb2:#212633; --sb3:#29303e; --sbbd:#2c333f;
  --sbtx:#eef1f7; --sbtx2:#a7b0c1; --sbtx3:#77808f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font); background:var(--bg); color:var(--tx);
  font-size:13px; font-weight:450; line-height:1.6; letter-spacing:var(--ls);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility; font-feature-settings:"tnum" 0;
}
b,strong{font-weight:600}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.028em;margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ══════════ SIDEBAR : 모던 라이트 어드민 ══════════ */
.sb{position:fixed;left:0;top:0;bottom:0;width:var(--sbw);background:var(--sb);
  border-right:1px solid var(--sbbd);display:flex;flex-direction:column;z-index:60}
.sb-hd{padding:18px 18px 15px;border-bottom:1px solid var(--sbbd)}
/* ── 공식 로고 : 심볼 34px + 서비스 타이틀 세로 중앙 정렬 ── */
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:12px;width:100%;
  background:none;border:0;padding:0;cursor:pointer;font-family:inherit;text-align:left;
  border-radius:var(--r3);transition:.15s}
.sb-logo:hover{opacity:.82}
.sb-logo:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.sb-mark{width:34px;height:34px;flex:0 0 auto;object-fit:contain;display:block;
  filter:drop-shadow(0 2px 6px rgba(90,120,210,.26))}
.sb-logo h1{margin:0;font-size:13.5px;font-weight:600;color:var(--sbtx);line-height:1.32;
  word-break:keep-all}
.sb-up{background:var(--sb2);border:1px solid var(--sbbd);border-radius:var(--r3);padding:9px 11px}
.sb-up .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--sbtx2)}
.sb-up .row + .row{margin-top:5px}
.sb-up b{color:var(--sbtx);font-weight:600}
.sb-up .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--oks);display:inline-block;margin-right:6px}
.sb-up .dot.syncing{background:var(--wn);box-shadow:0 0 0 3px var(--wns);animation:pulse 1s infinite}
.sb-up .dot.err{background:var(--dn);box-shadow:0 0 0 3px var(--dns)}
.sb-up .dot.idle{background:var(--tx3);box-shadow:0 0 0 3px var(--s3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}
.sb-sync{width:100%;margin-top:9px;background:var(--acs);border:1px solid var(--ac);color:var(--acd);
  border-radius:var(--r3);padding:9px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;
  letter-spacing:var(--ls);transition:.16s;display:flex;align-items:center;justify-content:center;gap:7px}
.sb-sync:hover{background:var(--ac);color:#fff}
.sb-sync.busy{opacity:.7;pointer-events:none;background:var(--sb2);border-color:var(--sbbd);color:var(--sbtx2)}
.sb-sync svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.sb-sync.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.sb-body{flex:1;overflow-y:auto;padding:6px 0 18px;scrollbar-width:thin}
.sb-body::-webkit-scrollbar{width:6px}
.sb-body::-webkit-scrollbar-thumb{background:var(--sb3);border-radius:3px}
.sb-grp{padding:16px 12px 8px}
.sb-grp + .sb-grp{border-top:1px solid var(--sbbd)}
.sb-lbl{font-size:9px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--sbtx3);
  padding:0 8px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sb-grp:first-child .sb-lbl,.sb-grp:nth-child(2) .sb-lbl{color:var(--acd);font-size:9.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 11px;border:0;border-radius:var(--r3);
  background:transparent;color:var(--sbtx2);cursor:pointer;font-family:inherit;text-align:left;
  transition:.15s;position:relative;letter-spacing:var(--ls)}
.nav button:hover{background:var(--sb2);color:var(--sbtx)}
.nav button.on{background:var(--acs);color:var(--acd)}
.nav button.on::after{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;
  border-radius:0 3px 3px 0;background:var(--ac)}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.nav .nt{flex:1;min-width:0}
.nav .n1{font-size:13px;font-weight:550;display:block}
.nav button.on .n1{font-weight:600}
.nav .n2{font-size:9.5px;color:var(--sbtx3);display:block;margin-top:1px;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .nc{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--sb3);
  color:var(--sbtx2);flex:0 0 auto}
.nav button.on .nc{background:var(--ac);color:#fff}

/* 폼 간격 규칙 : 필드 사이 12px · 라벨컨트롤 8px (전 구간 동일) */
.sfld{margin-bottom:12px;padding:0 8px}
.sfld:last-child{margin-bottom:0}
.sfld.hide{display:none}
.sfld label{display:block;font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--sbtx3);margin-bottom:8px}
.sb select,.sb input[type=text]{width:100%;background:var(--sb2);border:1px solid var(--sbbd);color:var(--sbtx);
  border-radius:var(--r4);padding:7.5px 9px;font-size:11.5px;font-family:inherit;font-weight:450;
  letter-spacing:var(--ls);outline:none;transition:.15s}
.sb select:hover,.sb input[type=text]:hover{border-color:var(--bd2)}
.sb select:focus,.sb input[type=text]:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs);background:var(--sb)}
/* 검색창 : 돋보기 아이콘 자리만큼 왼쪽 여백 확보.
   위의 `.sb input[type=text]` 규칙이 우선순위가 더 높아 padding-left 가 덮이므로
   같은 강도(.sb + 클래스 + 속성선택자)로 맞춰 겹침을 막습니다. */
.ssw{position:relative}
.sb .ssw input[type=text]{padding-left:30px}
.ssw svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:12px;height:12px;
  stroke:var(--sbtx3);fill:none;stroke-width:2;pointer-events:none}
.sseg{display:flex;gap:2px;background:var(--sb2);border:1px solid var(--sbbd);border-radius:var(--r4);padding:2px;margin:0 8px 12px}
.sseg.hide{display:none}
.sseg button{flex:1;border:0;background:transparent;color:var(--sbtx2);padding:6px 2px;border-radius:5px;
  font-size:10.5px;font-weight:550;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;letter-spacing:var(--ls)}
.sseg button:hover{color:var(--sbtx)}
.sseg button.on{background:var(--sb);color:var(--acd);font-weight:600;box-shadow:var(--sh)}
.sbtn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:1px solid var(--sbbd);border-radius:var(--r4);
  background:var(--sb2);color:var(--sbtx2);font-size:11.5px;font-weight:500;cursor:pointer;font-family:inherit;
  text-align:left;transition:.15s;text-decoration:none;margin-bottom:0;letter-spacing:var(--ls)}
.sbtn:hover{border-color:var(--bd2);color:var(--sbtx);background:var(--sb3)}
/* 필터가 하나도 없으면 초기화 버튼을 비활성 상태로 낮춰 표시 */
.sbtn.idle{opacity:.42;pointer-events:none}
.sbtn.act{border-color:var(--ac);background:var(--acs);color:var(--acd);font-weight:600}
.sbtn.act:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.sbtn .fbadge{margin-left:auto;font-size:9.5px;font-weight:600;padding:1.5px 7px;border-radius:999px;
  background:var(--ac);color:#fff;font-variant-numeric:tabular-nums}
.sbtn.idle .fbadge{display:none}
.sbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* ── 초소형 푸터 (설정 · 원본) ── */
.sb-ft{padding:9px 14px 10px;border-top:1px solid var(--sbbd);font-size:9.5px;color:var(--sbtx3);line-height:1.5}
.ficons{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.fico{width:24px;height:24px;border-radius:6px;border:1px solid var(--sbbd);background:var(--sb2);
  color:var(--sbtx2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  padding:0;transition:.15s;font-family:inherit}
.fico:hover{border-color:var(--bd2);color:var(--sbtx);background:var(--sb3)}
.fico.off{opacity:.45}
.fico svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ficons .fsp{flex:1}
.sb-ft .lk{display:inline-flex;align-items:center;gap:4px;color:var(--wnd);background:var(--wns);
  border-radius:999px;padding:2.5px 7px;font-size:8.5px;font-weight:600;white-space:nowrap}
.sb-ft .lk svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2}
.flinks{font-size:9px;color:var(--sbtx3);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.flinks a{color:var(--sbtx2);text-decoration:none;border-bottom:1px dotted var(--sbbd)}
.flinks a:hover{color:var(--acd);border-bottom-color:var(--acd)}
.flinks i{font-style:normal;opacity:.5}

.sb-tg{position:fixed;left:12px;top:12px;z-index:70;display:none;width:36px;height:36px;border-radius:10px;
  background:var(--sb);border:1px solid var(--sbbd);color:var(--tx);cursor:pointer}

/* ══════════ MAIN ══════════ */
.main{margin-left:var(--sbw);min-height:100vh;background:var(--bg);background-image:var(--bgimg);
  background-attachment:fixed;background-repeat:no-repeat}
.mw{max-width:1520px;margin:0 auto;padding:24px 26px 62px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.mhead h2{font-size:19.5px;font-weight:600;display:flex;align-items:center;gap:9px}
.mhead .d{font-size:11.5px;color:var(--tx2);margin-top:4px}
.pillb{background:var(--panel);border:1px solid var(--bd);border-radius:999px;padding:5.5px 12px;font-size:11px;
  color:var(--tx2);box-shadow:var(--sh);white-space:nowrap}
.pillb b{color:var(--tx)}
.btn{background:var(--panel);border:1px solid var(--bd);color:var(--tx2);border-radius:999px;padding:6.5px 13px;
  font-size:11px;font-weight:550;cursor:pointer;font-family:inherit;transition:.16s;white-space:nowrap;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--sh);letter-spacing:var(--ls)}
.btn:hover{border-color:var(--bd2);color:var(--tx)}
.btn.on{background:var(--acs);border-color:var(--ac);color:var(--acd);font-weight:600}
.toast{position:fixed;left:calc(50% + var(--sbw)/2);bottom:26px;transform:translateX(-50%) translateY(80px);z-index:200;
  background:var(--s1);border:1px solid var(--bd);border-radius:999px;padding:10px 19px;font-size:12px;
  box-shadow:0 12px 32px -10px rgba(24,28,40,.36);opacity:0;transition:.26s;pointer-events:none;max-width:80vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--dn);background:var(--dns);color:var(--dnd)}
.toast.ok{border-color:var(--ok);background:var(--oks);color:var(--okd)}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:11px;margin-bottom:18px}
.kpi{position:relative;overflow:hidden;padding:14px 16px 15px;cursor:pointer;transition:.17s;text-align:left;
  background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);font-family:inherit;
  letter-spacing:var(--ls)}
.kpi.static{cursor:default}
.kpi:not(.static):hover{transform:translateY(-2px);box-shadow:var(--shl)}
.kpi.active{border-color:var(--ac)}
.kpi .glow{position:absolute;right:-26px;top:-26px;width:80px;height:80px;border-radius:50%;opacity:.6}
.kpi .lb{font-size:10.5px;color:var(--tx2);font-weight:550;position:relative;display:flex;align-items:center;gap:6px}
.kpi .lb .em{font-size:14px;line-height:1}
.kpi .vl{font-size:28px;font-weight:600;letter-spacing:-.035em;margin-top:5px;line-height:1.05;
  font-variant-numeric:tabular-nums;position:relative}
.kpi .vl small{font-size:11.5px;color:var(--tx3);font-weight:500;letter-spacing:var(--ls);margin-left:3px}

.k1 .glow{background:var(--acs)} .k1 .vl{color:var(--acd)}
.k2 .glow{background:var(--pps)} .k2 .vl{color:var(--ppd)}
.k3 .glow{background:var(--ors)} .k3 .vl{color:var(--ord)}
.k4 .glow{background:var(--oks)} .k4 .vl{color:var(--okd)}
.k5 .glow{background:var(--dns)} .k5 .vl{color:var(--dnd)}
.k6 .glow{background:var(--cys)} .k6 .vl{color:var(--cyd)}

.view{display:none}.view.on{display:block}
/* 제목·서브텍스트는 왼쪽, 액션 버튼은 .pgrp 로 묶어 오른쪽 정렬 */
.phead{display:flex;align-items:center;gap:10px;padding:13px 17px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.pgrp{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:680px){.pgrp{margin-left:0;width:100%}}
.phead h3{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.note{font-size:10.5px;color:var(--tx3)}
.seg2{display:flex;gap:2px;background:var(--s3);border-radius:999px;padding:2.5px}
.seg2 button{border:0;background:transparent;color:var(--tx2);padding:6px 14px;border-radius:999px;font-size:11px;
  font-weight:550;cursor:pointer;font-family:inherit;transition:.16s;white-space:nowrap;letter-spacing:var(--ls)}
.seg2 button:hover{color:var(--tx)}
.seg2 button.on{background:var(--s1);color:var(--acd);font-weight:600;box-shadow:var(--sh)}

/* ══════ KANBAN : 여백 타이트 ══════ */
/* ══ 칸반 : 정형화된 컬럼 + 빈 단계 압축 ══ */
/* ══ 개발 프로세스 3분류 섹션 (세로 나열) ══ */
.cats{padding:14px;display:flex;flex-direction:column;gap:16px}
.cat{border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;background:var(--s1)}
.cath{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--s2);
  border-bottom:1px solid var(--bd)}
.cath h4{margin:0;font-size:13.5px;font-weight:600;color:var(--tx);letter-spacing:var(--ls);
  display:flex;align-items:baseline;gap:8px}
.cath .cen{font-size:9.5px;font-weight:500;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase}
.cath .cnt{min-width:24px;height:22px;padding:0 8px;border-radius:999px;background:var(--ac);color:#fff;
  font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums}
.cath .cdone{margin-left:auto;border:1px solid var(--bd);background:var(--s1);color:var(--tx2);
  border-radius:999px;padding:4px 11px;font-size:10.5px;font-weight:550;cursor:pointer;
  font-family:inherit;letter-spacing:var(--ls);transition:.15s;font-variant-numeric:tabular-nums}
.cath .cdone:hover{border-color:var(--bd2);color:var(--tx)}
.cath .cdone.on{background:var(--acs);border-color:var(--ac);color:var(--acd);font-weight:600}
.cts table{width:100%}
.cts td.cempty{text-align:center;color:var(--tx3);font-size:11px;padding:18px 0;letter-spacing:var(--ls)}
.cts tr.dimrow td{opacity:.55}
/* .lk2 공통 규칙은 TABLE 섹션에 정의 */
.kb{display:flex;gap:10px;overflow-x:auto;padding:14px;align-items:flex-start}
.kc{flex:0 0 216px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r2);
  display:flex;flex-direction:column;max-height:540px;transition:flex-basis .2s,opacity .2s}
.kc.full{background:var(--s1);box-shadow:var(--sh)}
/* 제품이 없는 단계 → 폭·높이 압축 + 채도 낮춤 */
.kc.empty{flex:0 0 128px;opacity:.55;background:transparent;border-style:dashed}
.kc.empty:hover{opacity:.85}
.kc.empty .kch{border-bottom:0;padding:9px 10px}
.kc.empty .kct .n{font-size:10.5px}
.kc.empty .kbar{display:none}
.kc.empty .kcb{padding:0 10px 10px}
.kch{padding:11px 11px 10px;border-bottom:1px solid var(--bd)}
.kct{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.kct .se{font-size:13px;line-height:1;flex:0 0 auto}
.kct span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.kn{border-radius:999px;padding:2px 7.5px;font-size:10px;font-weight:600;flex:0 0 auto;font-variant-numeric:tabular-nums}
.kbar{height:3px;border-radius:999px;margin-top:9px}
.kcb{padding:9px;display:flex;flex-direction:column;gap:7px;overflow-y:auto}
.kd{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r3);padding:11px 11px 10px;
  border-left:3px solid var(--bd2);transition:.15s;cursor:pointer;text-align:left;font-family:inherit;
  width:100%;display:flex;flex-direction:column;gap:8px;letter-spacing:var(--ls);min-height:66px}
.kd:hover{box-shadow:var(--shl);border-color:var(--bd2);transform:translateY(-1px)}
.kd.late{border-left-color:var(--dn)}
.kd .tt{font-size:12.5px;font-weight:550;word-break:keep-all;line-height:1.42;color:var(--tx)}
.kd:hover .tt{color:var(--acd)}
.kd .ow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:auto}
.kmt{color:var(--tx3);font-size:10px;text-align:center;padding:8px 0 4px;letter-spacing:var(--ls)}
.kc.empty .kmt{padding:2px 0 0;font-size:9.5px;opacity:.8}
.more{background:var(--s3);border:1px dashed var(--bd2);border-radius:var(--r4);padding:6px;font-size:10.5px;
  color:var(--tx2);cursor:pointer;text-align:center;font-weight:550;font-family:inherit;letter-spacing:var(--ls)}
.more:hover{background:var(--s4);color:var(--tx)}

/* ── PROCESS + GANTT ── */
.proc{padding:14px 17px;border-bottom:1px solid var(--bd);background:var(--s2)}
.proc h4{margin-bottom:10px;font-size:9.5px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em}
.steps{display:flex;overflow-x:auto;padding-bottom:4px}
.step{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 13px 6px 10px;background:var(--s1);
  border:1px solid var(--bd);font-size:11px;font-weight:500;color:var(--tx2);white-space:nowrap;margin-right:-1px}
.step:first-child{border-radius:var(--r3) 0 0 var(--r3)}
.step:last-child{border-radius:0 var(--r3) var(--r3) 0}
.step em{font-style:normal;width:17px;height:17px;border-radius:50%;font-size:9px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--s3);color:var(--tx3)}
.step b{font-weight:600;font-size:9.5px;padding:1px 5px;border-radius:999px;background:var(--s1);margin-left:1px}
.step.g1{background:var(--pps);color:var(--ppd);border-color:var(--pps)} .step.g1 em{background:var(--pp);color:#fff}
.step.g2{background:var(--ors);color:var(--ord);border-color:var(--ors)} .step.g2 em{background:var(--or);color:#fff}
.step.g3{background:var(--wns);color:var(--wnd);border-color:var(--wns)} .step.g3 em{background:var(--wn);color:#fff}
.step.g4{background:var(--oks);color:var(--okd);border-color:var(--oks)} .step.g4 em{background:var(--ok);color:#fff}
.gs{overflow-x:auto}
.gantt{min-width:920px}
.ghead{position:sticky;top:0;z-index:4;background:var(--s1);border-bottom:1px solid var(--bd2)}
.grow{display:flex}
.glbl{flex:0 0 244px;padding:8px 15px;border-right:1px solid var(--bd);min-width:0}
.gtrk{flex:1;display:flex;position:relative;min-width:0}
.gq{flex:1;text-align:center;padding:7px 2px;font-size:10px;font-weight:600;color:var(--tx2);
  border-left:1px solid var(--bd);background:var(--s2)}
.gq.now{background:var(--acs);color:var(--acd)}
.gm{flex:1;text-align:center;padding:5px 2px;font-size:9.5px;color:var(--tx3);font-weight:500;
  border-left:1px solid var(--grid);overflow:hidden;white-space:nowrap;min-width:0}
.glbl.hd{display:flex;align-items:flex-end;font-size:9.5px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em}
.gbody .grow{border-bottom:1px solid var(--grid);min-height:44px}
.gbody .grow:nth-child(even){background:var(--zebra)}
.gbody .grow:hover{background:var(--acs)}
.gbody .glbl{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:7px 15px}
.gnm{font-size:12px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gnm:hover{color:var(--acd)}
.gmt{font-size:9.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtrk.bd{position:relative;padding:10px 0}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.gl.q{background:var(--gridq)}
.gbar{position:absolute;height:22px;border-radius:7px;display:flex;align-items:center;padding:0 8px;font-size:10px;
  font-weight:550;white-space:nowrap;overflow:visible;box-shadow:var(--sh);cursor:pointer;letter-spacing:var(--ls)}
.gbar .lbl{overflow:hidden;text-overflow:ellipsis}
.gbar.late{box-shadow:0 0 0 2px var(--dn),var(--sh)}
.gbar.dim{opacity:.55}
.gbar.clip{border-top-left-radius:2px;border-bottom-left-radius:2px}
.gbar.clip::before{content:"";position:absolute;left:-12px;top:3px;font-size:8.5px;color:var(--tx3)}
/* 일정 미입력 / 과거 종료 행 표시 */
.gph{position:absolute;left:6px;top:11px;height:20px;display:inline-flex;align-items:center;gap:6px;
  padding:0 10px;border-radius:7px;border:1px dashed var(--bd2);background:var(--s2);color:var(--tx3);
  font-size:9.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.gph:hover{border-color:var(--ac);color:var(--acd);background:var(--acs)}
.gstep{position:absolute;top:-8px;left:5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  background:var(--s1);border:2px solid currentColor;font-size:9.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--sh);z-index:2}
.gms.big{width:14px;height:14px;top:16px;border-width:2px;cursor:pointer;z-index:2}
.gms.big.late{box-shadow:0 0 0 2px var(--dn)}
.gmslbl{position:absolute;top:14px;height:18px;display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:550;white-space:nowrap;cursor:pointer;letter-spacing:var(--ls)}
.gms{position:absolute;width:10px;height:10px;transform:rotate(45deg);border-radius:2px;top:17px;
  background:var(--dn);border:2px solid var(--s1);box-shadow:0 0 0 1px var(--dn)}
.gtd{position:absolute;top:0;bottom:0;width:2px;background:var(--dn);z-index:3;opacity:.75}
.ghead .gtd::after{content:"TODAY";position:absolute;top:2px;left:4px;font-size:8.5px;font-weight:600;color:var(--dnd);letter-spacing:.09em}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--tx2);align-items:center}
.lgd i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.gnotice{padding:10px 17px;background:var(--acs);border-bottom:1px solid var(--bd);font-size:10.5px;color:var(--acd);display:flex;align-items:center;gap:7px}

/* ── 브랜드 카드 그리드 ── */
/* ── 원산지 구분 탭 (전체 / 국내 / 해외) ── */
.otabs{display:flex;gap:3px;background:var(--s3);border-radius:999px;padding:3px;
  margin-bottom:16px;width:fit-content;max-width:100%;overflow-x:auto}
.otabs button{border:0;background:transparent;color:var(--tx2);padding:8px 18px;border-radius:999px;
  font-size:12px;font-weight:550;cursor:pointer;font-family:inherit;transition:.16s;
  white-space:nowrap;letter-spacing:var(--ls);display:inline-flex;align-items:center;gap:7px}
.otabs button:hover{color:var(--tx)}
.otabs button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* Active : 배경·글자색 모두 강조 (브랜드 카드 톤과 충돌하지 않는 어센트 블루) */
.otabs button.on{background:var(--ac);color:#fff;font-weight:600;
  box-shadow:0 1px 3px rgba(60,90,170,.28)}
.otabs button.on:hover{color:#fff}
.otabs button .oc{font-size:10.5px;font-weight:600;padding:1.5px 7px;border-radius:999px;
  background:var(--s4);color:var(--tx3);font-variant-numeric:tabular-nums;transition:.16s}
.otabs button.on .oc{background:rgba(255,255,255,.24);color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:12px;margin-bottom:18px}
.bcard{position:relative;overflow:hidden;border:0;border-radius:16px;padding:18px 18px 16px;cursor:pointer;
  font-family:inherit;text-align:left;color:#fff;min-height:104px;display:flex;flex-direction:column;
  justify-content:flex-end;letter-spacing:var(--ls);
  transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s}
.bcard::after{content:"";position:absolute;right:-30px;top:-38px;width:104px;height:104px;border-radius:50%;
  background:rgba(255,255,255,.15);z-index:0}
.bcard > *{position:relative;z-index:1}
.bcard:hover{transform:translateY(-4px)}
.bcard.sel::after{background:rgba(255,255,255,.25)}
.bcard .bn{font-size:15.5px;font-weight:600;line-height:1.3;word-break:keep-all;padding-right:34px}
.bcard .bc{font-size:11.5px;font-weight:500;opacity:.93;margin-top:4px;padding-right:34px}
.bcard .bmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.bcard .bt{background:rgba(255,255,255,.22);border-radius:5px;padding:2.5px 7px;font-size:9px;font-weight:550;white-space:nowrap}
.bcard .barr{position:absolute;right:15px;bottom:14px;width:29px;height:29px;border-radius:50%;
  background:rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;font-size:14px;
  font-weight:600;transition:.2s;z-index:1}
.bcard:hover .barr{background:#fff;color:#1e2532;transform:translateX(3px)}
.bcard.sel .barr{background:#fff;color:#1e2532;transform:rotate(90deg)}
.bcard.all{background:linear-gradient(140deg,#5b6480,#404859)}
.bdet{opacity:0;max-height:0;overflow:hidden;transition:opacity .28s ease,max-height .38s cubic-bezier(.2,.8,.3,1)}
.bdet.on{opacity:1;max-height:5600px}
.bdhd{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.bdhd .sw2{width:5px;height:34px;border-radius:3px;flex:0 0 auto}
.bdhd .tt2{flex:1;min-width:0}
.bdhd h3{font-size:15px;font-weight:600}
.bdhd .sd2{font-size:11px;color:var(--tx2);margin-top:2px}
.bdclose{border:1px solid var(--bd);background:var(--s1);color:var(--tx2);border-radius:999px;padding:6.5px 13px;
  font-size:11px;font-weight:550;cursor:pointer;font-family:inherit;letter-spacing:var(--ls)}
.bdclose:hover{border-color:var(--dn);background:var(--dns);color:var(--dnd)}

/* ── BADGES ── */
.tg{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:550;padding:3px 7px;
  border-radius:5px;white-space:nowrap;line-height:1.35;letter-spacing:var(--ls)}
.tg.gray{background:var(--s3);color:var(--tx2)}
.tg.blue{background:var(--acs);color:var(--acd)}
.tg.green{background:var(--oks);color:var(--okd)}
.tg.red{background:var(--dns);color:var(--dnd)}
.tg.yellow{background:var(--wns);color:var(--wnd)}
.tg.purple{background:var(--pps);color:var(--ppd)}
.tg.orange{background:var(--ors);color:var(--ord)}
.tg.cyan{background:var(--cys);color:var(--cyd)}
.tg.lg{font-size:11px;padding:5px 11px;border-radius:7px;font-weight:600}
/* ═══  NEW 스타버스트 배지 (등록/발주 7일 이내 자동 표시 · 이후 소멸) ═══ */
.nbadge{display:inline-block;margin-left:5px;padding:1.5px 6px;border-radius:4px;
  background:var(--dn);color:#fff;font-size:8.5px;font-weight:700;letter-spacing:.06em;
  vertical-align:1.5px;flex:0 0 auto;line-height:1.5}
.nbadge.sm{font-size:8px;padding:1px 5px}
.nbadge.lg{font-size:9.5px;padding:2px 7px;vertical-align:2px}
/* 7일 초과 '최신 N건' 보정 표기는 배지와 구분되는 작은 텍스트 칩 */
.tg.latest{background:var(--wns);color:var(--wnd);font-weight:600;
  box-shadow:0 0 0 1px var(--wn) inset;letter-spacing:0}
.bnew{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:4px;
  background:rgba(255,255,255,.28);color:#fff;font-size:8px;font-weight:700;letter-spacing:.06em;
  vertical-align:1.5px;line-height:1.5}
.stepdot{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;font-size:9px;font-weight:600;background:var(--s3);color:var(--tx2);font-variant-numeric:tabular-nums}

/* ── TABLE ── */
.ts{overflow:auto;max-height:600px}
table{width:100%;border-collapse:collapse;min-width:880px}
thead th{position:sticky;top:0;background:var(--s2);z-index:3;text-align:left;font-size:9.5px;font-weight:600;
  color:var(--tx3);text-transform:uppercase;letter-spacing:.09em;padding:10px 13px;border-bottom:1px solid var(--bd2);
  white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--tx)}
thead th .ar{opacity:.28;margin-left:4px;font-size:8px}
thead th.srt .ar{opacity:1;color:var(--ac)}
tbody td{padding:9px 13px;border-bottom:1px solid var(--grid);font-size:11.5px;vertical-align:middle}
/* 행 전체는 클릭 대상이 아님 — 기본 화살표 커서 유지.
   실제 클릭(상세 팝업)은 '제품명' 셀 안의 .lk2 버튼에만 걸립니다. */
tbody tr{cursor:default;transition:.13s}
tbody tr:hover{background:var(--acs)}
tbody tr.late td:first-child{box-shadow:inset 3px 0 0 var(--dn)}
td.nm{font-weight:550;min-width:208px;color:var(--tx)}
/* ── 클릭 가능한 제품명 링크 ── */
.lk2{background:none;border:0;padding:0;margin:0;font:inherit;font-weight:550;color:var(--tx);
  cursor:pointer;text-align:left;letter-spacing:var(--ls);text-decoration:none;
  border-bottom:1px solid transparent;transition:.13s}
.lk2:hover,.lk2:focus-visible{color:var(--acd);border-bottom-color:currentColor}
.lk2:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:3px}
tbody tr:hover .lk2{color:var(--acd)}
td.dt,td.qt{font-variant-numeric:tabular-nums;color:var(--tx2);white-space:nowrap;font-size:11px}
td.qt{text-align:right;font-weight:550;color:var(--tx)}
.dsh{color:var(--tx3)}
.mt{padding:48px 20px;text-align:center;color:var(--tx3)}
.mt .bg{font-size:30px;margin-bottom:9px;opacity:.4}

/* ══════ MODAL ══════ */
.mask{position:fixed;inset:0;background:var(--ov);backdrop-filter:blur(4px);z-index:150;display:none;
  align-items:flex-start;justify-content:center;padding:38px 20px;overflow-y:auto}
.mask.on{display:flex}
.modal{background:var(--s1);border:1px solid var(--bd);border-radius:18px;width:100%;max-width:860px;
  box-shadow:0 24px 68px -16px rgba(20,24,36,.46);overflow:hidden;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(13px) scale(.986)}to{opacity:1;transform:none}}
.mhd{padding:22px 26px 17px;background:var(--s2);border-bottom:1px solid var(--bd);position:relative}
.mhd .eb{font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.mhd h2{margin-top:7px;font-size:20px;font-weight:600;line-height:1.28;padding-right:44px}
.mhd .mstep{display:inline-flex;align-items:center;gap:7px;margin-top:11px;padding:5px 12px;border-radius:999px;
  background:var(--s3);font-size:11px;font-weight:550;color:var(--tx2)}
.mhd .mstep em{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--s1);
  display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600}
.mhd .mtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.mx{position:absolute;top:20px;right:20px;width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);
  background:var(--s1);color:var(--tx2);font-size:15px;cursor:pointer;line-height:1;font-family:inherit;transition:.16s}
.mx:hover{background:var(--dns);color:var(--dnd);border-color:var(--dn)}
.mbd{padding:4px 26px 22px;max-height:56vh;overflow-y:auto}
.msec{margin-top:19px}
.msec > h4{margin-bottom:11px;font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--tx3);display:flex;align-items:center;gap:9px}
.msec > h4::after{content:"";flex:1;height:1px;background:var(--bd)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(204px,1fr));gap:10px}
.mf{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r3);padding:11px 13px}
.mf.wide{grid-column:1/-1}
.mf .k{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin-bottom:4px}
.mf .v{font-size:12px;color:var(--tx);line-height:1.62;word-break:break-word;white-space:pre-wrap;font-weight:450}
.mf .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;letter-spacing:.4px;font-weight:550}
.mf .v.em{color:var(--tx3)}
.mf.hl{background:var(--wns);border-color:var(--wn)} .mf.hl .k{color:var(--wnd)}
.mf.code2{background:var(--acs);border-color:var(--ac)} .mf.code2 .k{color:var(--acd)}
.mf.po{background:var(--oks);border-color:var(--ok)} .mf.po .k{color:var(--okd)}
/* ── 키-값 스펙 표 ── */
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px;font-size:10.5px;color:var(--tx3)}
.crumb i{font-style:normal;opacity:.55}
.crumb b{color:var(--tx2);font-weight:550}
.spectbl{width:100%;min-width:0;border-collapse:collapse;margin-top:16px;
  border:1px solid var(--bd);border-radius:var(--r3);overflow:hidden}
.spectbl tr{border-bottom:1px solid var(--grid)}
.spectbl tr:last-child{border-bottom:0}
.spectbl tr.na td{color:var(--tx3)}
.spectbl th{width:168px;text-align:left;vertical-align:top;padding:11px 14px;background:var(--s2);
  font-size:10.5px;font-weight:600;color:var(--tx2);letter-spacing:var(--ls);white-space:nowrap;
  border-right:1px solid var(--bd);position:static}
.spectbl td{padding:11px 14px;font-size:12px;font-weight:450;color:var(--tx);line-height:1.62;
  word-break:break-word;white-space:pre-wrap;background:var(--s1)}
.spectbl td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;letter-spacing:.4px;font-weight:550}
.spectbl td .ovd{color:var(--dnd);font-weight:600}
.spectbl .lbtn.drvbtn{padding:6px 12px;font-size:11px}
.spectbl .lbtn.drvbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linejoin:round;flex:0 0 auto}
.spectbl.slim{margin-top:10px}
.spectbl.slim th{width:88px;font-variant-numeric:tabular-nums;font-weight:550}
.spectbl.slim td{font-size:11.5px;padding:8px 14px}
.specnote{margin-top:11px;padding:11px 14px;border-radius:var(--r3);background:var(--wns);
  border:1px solid var(--wn);color:var(--wnd);font-size:11px}
.posec{margin-top:22px}
.posec h4{font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3);
  display:flex;align-items:center;gap:8px;margin-bottom:10px}
.posec h4::after{content:"";flex:1;height:1px;background:var(--bd)}
.pobox{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--bd);
  border:1px solid var(--bd);border-radius:var(--r3);overflow:hidden}
.poc{background:var(--oks);padding:12px 14px}
.poc .k{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--okd);opacity:.85}
.poc .v{font-size:19px;font-weight:600;color:var(--okd);margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.poc .v.sm{font-size:14px}
.poc .v small{font-size:10.5px;font-weight:500;margin-left:3px;opacity:.8}
/* Slack 바로가기 — 브랜드 컬러로 강조 */
.slackbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;
  font-size:11.5px;font-weight:600;text-decoration:none;letter-spacing:var(--ls);white-space:nowrap;
  background:#4A154B;color:#fff;border:1px solid #4A154B;transition:.16s;
  box-shadow:0 2px 8px -3px rgba(74,21,75,.5)}
.slackbtn:hover{background:#611f64;border-color:#611f64;transform:translateY(-1px)}
.slackbtn svg{width:13px;height:13px;fill:currentColor;flex:0 0 auto}
.slackbtn.sm{padding:4px 10px;font-size:10.5px;margin-left:auto;letter-spacing:0;
  box-shadow:none;text-transform:none}
.slackbtn.sm svg{width:11px;height:11px}
.posec h4{gap:8px}
.posec h4::after{order:-1}
.mft{padding:15px 26px;border-top:1px solid var(--bd);background:var(--s2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r3);font-size:11.5px;font-weight:550;
  text-decoration:none;border:1px solid var(--bd);background:var(--s1);color:var(--tx2);transition:.16s;letter-spacing:var(--ls)}
.lbtn:hover{border-color:var(--ac);background:var(--acs);color:var(--acd)}
.lbtn.p{background:var(--acs);border-color:var(--ac);color:var(--acd);font-weight:600}
.mft .sp2{flex:1}
.mft .rolbl{font-size:10px;color:var(--tx3)}

@media(max-width:1080px){
  .sb{transform:translateX(-100%);transition:transform .24s;box-shadow:0 0 36px rgba(0,0,0,.18)}
  .sb.open{transform:none}
  .sb-tg{display:block}
  .main{margin-left:0}
  .mw{padding:60px 14px 44px}
  .toast{left:50%}
}
@media(max-width:620px){.mhead h2{font-size:17px}.mbd,.mhd,.mft{padding-left:17px;padding-right:17px}.bgrid{grid-template-columns:1fr}}
</style>
</head>

/* ★ 담당자명 정제 : "Jake(배영훈)" → "Jake" */
const NAME_FIX={"Dasiy":"Daisy"};
function cleanOwner(raw){
  if(!raw) return null;
  let s=String(raw).replace(/[（(\[［][^)）\]］]*[)）\]］]/g,"")
    .replace(/[·,/|]\s*[가-힣]{2,4}\s*$/,"").replace(/\s+/g," ").trim();
  if(!s) s=String(raw).replace(/[（(\[][^)）\]]*[)）\]]/g,"").trim();
  if(/^[가-힣\s]+$/.test(s)) return s;
  s=s.replace(/[가-힣]+/g,"").replace(/\s+/g," ").trim()||s;
  return NAME_FIX[s]||s;
}

/* ═══════════  NEW 태그 : 등록 7일 이내만 표시 (이후 자동 소멸) ═══════════
   판정 우선순위
      it.created  … Notion created_time (실제 생성일)
      firstSeen   … 스프레드시트처럼 생성일이 없는 소스는 '이 대시보드에서 처음
                     발견한 날'을 localStorage 에 기록해 대체 (원본은 건드리지 않음)
   최초 실행 시에는 기존 품목 전체를 '기존 품목'으로 시드해 오탐을 막습니다.        */
const NEW_DAYS=7;
const SEEN_KEY="pb_dash_seen_v1";
const DAY=86400000;
function loadSeen(){
  try{ return JSON.parse(localStorage.getItem(SEEN_KEY)||"null") }catch(e){ return null }
}
function saveSeen(m){ try{ localStorage.setItem(SEEN_KEY,JSON.stringify(m)) }catch(e){} }
let SEEN=loadSeen();
function trackSeen(items){
  const today=TSTR;
  if(SEEN===null){                                  // 최초 실행 → 전부 기존 품목으로 시드
    SEEN={}; items.forEach(i=>SEEN[i.key]="");
    saveSeen(SEEN); return;
  }
  let dirty=false;
  items.forEach(i=>{ if(!(i.key in SEEN)){ SEEN[i.key]=today; dirty=true } });
  if(dirty) saveSeen(SEEN);
}
/* 등록일 기준 경과일 (없으면 null) */
function ageDays(it){
  const d=it.created||(SEEN&&SEEN[it.key])||null;
  if(!d) return null;
  const t=Date.parse(d+"T00:00:00Z");
  if(isNaN(t)) return null;
  return Math.floor((+TODAY-t)/DAY);
}
const isNew=it=>{ const a=ageDays(it); return a!==null&&a>=0&&a<NEW_DAYS };
/* NEW 뱃지 — 이모지·그래픽 없이 텍스트만 (size: "" | "sm" | "lg") */
const NEW_SVG=(size,title)=>
  `<span class="nbadge ${size||""}"${title?` title="${title}"`:""}>NEW</span>`;
/* 제품명 뒤에 붙는 NEW 배지 */
const newTag=it=>isNew(it)?NEW_SVG("sm",`등록 ${ageDays(it)}일차 · 7일 후 자동 해제`):"";

/* ═══════════════════════════════════════════════════════════════════════
    발주 건 NEW 태그 — 날짜 차이(Date Diff) 계산
   ───────────────────────────────────────────────────────────────────────
    두 날짜를 모두 UTC 자정으로 정규화해 시간대·서머타임 영향을 제거
    (오늘 - 발주일) / 86,400,000ms  →  경과 일수(정수)
    0 <= 경과일 < 7  이면 NEW,  7일째부터 자동 소멸
      · 발주일이 미래인 건(경과일 < 0)은 NEW 로 보지 않음
      · 날짜 파싱 실패 시 null → NEW 미표시
    markLatest : 7일 규칙만으로는 아무것도 안 걸릴 때(최신 발주가 오래된 경우)
      최신 N건에 NEW 를 표시하는 옵션. 0 으로 두면 순수 7일 규칙만 적용됩니다.
   ═══════════════════════════════════════════════════════════════════════ */
const ORDER_NEW = { days: 7, markLatest: 2 };

/* 경과 일수 : 발주일 → 오늘 (UTC 자정 기준 정수 일) */
function orderAgeDays(o){
  if(!o || !o.date) return null;
  const t = Date.parse(String(o.date).slice(0,10) + "T00:00:00Z");
  if(isNaN(t)) return null;
  return Math.floor((+TODAY - t) / DAY);          // DAY = 86400000
}
/* 최신 발주 N건의 ts 집합 (markLatest 용) */
let LATEST_TS = new Set();
function computeLatestOrders(){
  LATEST_TS = new Set(
    [...DB.orders].sort((a,b)=>String(b.date).localeCompare(String(a.date)))
                  .slice(0, Math.max(0, ORDER_NEW.markLatest))
                  .map(o=>o.ts)
  );
}
/* NEW 판정 :  7일 이내  또는   최신 N건(markLatest) */
function isNewOrder(o){
  const a = orderAgeDays(o);
  if(a !== null && a >= 0 && a < ORDER_NEW.days) return true;   // 7일 이내 → NEW
  return ORDER_NEW.markLatest > 0 && LATEST_TS.has(o.ts);       // 최신 N건 보정
}
/* 발주 목록에 붙는 배지 (경과일을 툴팁으로 노출) */
function orderNewTag(o){
  if(!isNewOrder(o)) return "";
  const a = orderAgeDays(o);
  const byDate = a !== null && a >= 0 && a < ORDER_NEW.days;
  return byDate
    ? NEW_SVG("sm", `발주일 ${o.date} · ${a}일 경과 · 7일 후 자동 해제`)
    : ` <span class="tg latest" title="발주일 ${o.date} · ${a}일 경과 (최신 ${ORDER_NEW.markLatest}건 표시)">최신</span>`;
}

/* ═══════════ 크로스체크 로직 (슬랙  제품) ═══════════ */
const BRAND_TOKENS=["ydy뉴트리션","ydy","유트리션","utrition","파이토알엑스","phytorx","데이타민","박약다식","유한"];
const NAME_TYPO={"풀스팩":"풀스펙","코랩":"코랄","이뮤":"이뮨","오메챠":"오메츄","벌류팩":"밸류팩"};
function nname(s){
  s=String(s||"").toLowerCase();
  for(const [a,b] of Object.entries(NAME_TYPO)) s=s.split(a).join(b);
  s=s.replace(/\([^)]*\)/g,"");
  for(const t of BRAND_TOKENS) s=s.split(t).join("");
  return s.replace(/[\s·\-&,\.\/\(\)\[\]]/g,"");
}
const MAKER_ALIAS={"콜마비엔에이치":"콜마비앤에이치","엔피케이솔루션즈":"엔피케이","한풍테이처팜":"한풍네이처팜",
  "주식회사한독":"한독헬스케어","한독":"한독헬스케어","팜크로스":"한독헬스케어"};
function nmaker(s){
  s=String(s||"").toLowerCase().replace(/\(주\)|주식회사|㈜/g,"").replace(/[\s·\-&,\.\/\(\)]/g,"");
  for(const [a,b] of Object.entries(MAKER_ALIAS)) if(s.includes(a)) return b;
  return s;
}
/* 발주 데이터 → 제품 매칭 + 제품별 집계 (동기화 후에도 재계산) */
function crosscheck(){
  computeLatestOrders();                    // 최신 발주 N건 갱신
  const byName={};
  DB.items.forEach(it=>{(byName[nname(it.name)]=byName[nname(it.name)]||[]).push(it)});
  DB.items.forEach(it=>it.po=null);
  const agg={};
  DB.orders.forEach(o=>{ o.recent=String(o.date||"")>=PO_FROM });
  DB.orders.forEach(o=>{
    if(o.kind==="부자재"){ o.match="material"; o.matchKey=null; o.matchName=null; o.makerOk=null; return; }
    const hits=byName[nname(o.product)]||[];
    if(!hits.length){ o.match="none"; o.matchKey=null; o.matchName=null; o.makerOk=null; return; }
    const t=hits[0], sm=nmaker(t.maker), sl=String(o.vendor||"").split("/").map(nmaker);
    const ok=sl.some(m=>m&&sm&&(m===sm||m.includes(sm)||sm.includes(m)));
    o.match=ok?"full":"name"; o.matchKey=t.key; o.matchName=t.name; o.makerOk=!!ok;
    if(!o.recent) return;                       // 집계는 2026-01-01 이후 건만
    const a=agg[t.key]||(agg[t.key]={count:0,qty:0,last:null,unit:o.unit});
    a.count++; a.qty+=Number(o.qty||0);
    if(!a.last||o.date>a.last) a.last=o.date;
  });
  Object.entries(agg).forEach(([k,v])=>{ if(BY_KEY[k]) BY_KEY[k].po=v });
}

/* GET / POST(조회) 만 사용 — 쓰기 메서드 없음 */
async function queryNotion(){
  const C=NOTION_CONFIG;
  const relay=async b=>{const r=await fetch(C.relayUrl,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({databaseId:C.databaseId,body:b})});
    if(!r.ok) throw new Error("릴레이 응답 "+r.status); return r.json()};
  const direct=async b=>{const r=await fetch(`https://api.notion.com/v1/databases/${C.databaseId}/query`,{method:"POST",
    headers:{"Authorization":"Bearer "+C.apiKey,"Notion-Version":C.notionVersion,"Content-Type":"application/json"},
    body:JSON.stringify(b)}); if(!r.ok) throw new Error("Notion API "+r.status); return r.json()};
  let mode=null;
  if(C.relayUrl){ try{ await relay({page_size:1}); mode="relay"; }catch(e){ mode=null } }
  if(!mode&&C.apiKey){ try{ await direct({page_size:1}); mode="direct"; }
    catch(e){ throw new Error("Notion 직접 호출이 브라우저에서 차단되었습니다(CORS). notion_relay.py 를 실행해 주세요.") } }
  if(!mode) throw new Error("동기화 설정이 없습니다. NOTION_CONFIG 를 확인해 주세요.");
  const call=mode==="relay"?relay:direct, out=[]; let cur=null;
  do{ const b={page_size:100}; if(cur) b.start_cursor=cur;
      const d=await call(b); out.push(...(d.results||[])); cur=d.has_more?d.next_cursor:null; }while(cur);
  return {items:out.map(notionToItem),mode};
}
/* ── Slack 발주 메시지 파서 (라벨·볼드·오타 변형 대응) ── */
/* ★ 대외비 : 금액 라벨은 파싱 대상에서 제외 — 값이 메모리에도 들어오지 않습니다 */
const PO_LABEL={product:["제품명","품목명","품목"],vendor:["제조사","거래처"],
  qty:["발주수량","수량"],due:["납기일","예상납기일","예상 납기일","남기일"]};
function pickField(text,keys){
  for(const k of keys){
    const re=new RegExp("(?:^|\\n)\\s*(?:[•\\-\\*]|[a-z]\\.)?\\s*\\*?"+k.replace(/\s/g,"\\s*")+"\\*?\\s*:\\s*(.+)","i");
    const m=text.match(re);
    if(m) return m[1].replace(/~[^~]*~\s*->\s*/,"").trim();   // 취소선 수정 표기 처리
  }
  return null;
}
function slackToOrder(msg,users){
  const raw=String(msg.text||"");
  const product=pickField(raw,PO_LABEL.product);
  if(!product) return null;                                    // 발주 메시지 아님
  const qtyRaw=pickField(raw,PO_LABEL.qty)||"";
  const qm=qtyRaw.replace(/,/g,"").match(/(\d+)\s*(set|ea|장|개)?/i);
  const title=(raw.match(/\*\[([^\]]+)\]\*/)||[])[1]||"";
  const isMat=/리플렛|스티커|부자재|인쇄/.test(product+title);
  const d=new Date(Number(String(msg.ts).split(".")[0])*1000);
  const iso=new Date(d.getTime()+9*3600e3).toISOString().slice(0,10);   // KST
  return {ts:String(msg.ts),date:iso,author:cleanOwner((users&&users[msg.user])||msg.user||"")||"",
    kind:isMat?"부자재":(/신규|초도/.test(title)?"신규발주":(/추가/.test(title)?"추가발주":
      (/리뉴얼/.test(title)?"리뉴얼":"재발주"))),
    product,vendor:pickField(raw,PO_LABEL.vendor)||"",
    qty:qm?Number(qm[1]):0,unit:(qm&&qm[2])||"set",
    due:pickField(raw,PO_LABEL.due),
    slackUrl:`https://pharmabroshq.slack.com/archives/${SLACK_CONFIG.channelId}/p${String(msg.ts).replace(".","")}`};
}
async function querySlack(){
  const C=SLACK_CONFIG;
  const relay=async()=>{const r=await fetch(C.relayUrl,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({channelId:C.channelId,limit:C.fetchLimit})});
    if(!r.ok) throw new Error("릴레이 응답 "+r.status); return r.json()};
  const direct=async()=>{const r=await fetch(
    `https://slack.com/api/conversations.history?channel=${C.channelId}&limit=${C.fetchLimit}`,
    {headers:{"Authorization":"Bearer "+C.botToken}});
    if(!r.ok) throw new Error("Slack API "+r.status); return r.json()};
  let d=null;
  if(C.relayUrl){ try{ d=await relay(); }catch(e){ d=null } }
  if(!d&&C.botToken){ try{ d=await direct(); }
    catch(e){ throw new Error("Slack 직접 호출이 차단되었습니다(CORS). notion_relay.py 를 실행해 주세요.") } }
  if(!d) return null;
  if(d.ok===false) throw new Error("Slack: "+(d.error||"unknown"));
  const users=d.users||{};
  return (d.messages||[]).map(m=>slackToOrder(m,users)).filter(Boolean);
}
/* ── 구글 스프레드시트 CSV 파서 (따옴표·개행 포함 셀 대응) ── */
function parseCSV(txt){
  const rows=[]; let row=[], cell="", q=false;
  txt=txt.replace(/^\uFEFF/,"");
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){
      if(c==='"'){ if(txt[i+1]==='"'){cell+='"';i++} else q=false }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===","){ row.push(cell); cell="" }
      else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell="" }
      else if(c!=="\r") cell+=c;
    }
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row) }
  return rows;
}
function sheetRowsToItems(rows){
  const COL=SHEET_CONFIG.columns;
  /* 공백·줄바꿈 정규화 (구글 시트는 헤더에 \n 을 넣는 경우가 있음) */
  const norm=c=>String(c==null?"":c).replace(/\s+/g," ").trim();
  const hi=rows.findIndex(r=>r.some(c=>norm(c).includes("제품명")));
  if(hi<0) throw new Error("CSV에서 '제품명' 헤더를 찾지 못했습니다. gid 를 확인해 주세요.");
  const hdr=rows[hi].map(norm);
  /* 병합셀로 헤더에 접두사가 붙어도(예: "*[커머스]… 기준 제품명") 매칭되도록
      정확 일치 우선   없으면 가장 긴 키가 포함된 경우로 매칭 */
  const keys=Object.keys(COL).sort((a,b)=>b.length-a.length);
  const idx={};
  hdr.forEach((h,i)=>{
    if(!h) return;
    let k=keys.find(k=>k===h) || keys.find(k=>h.includes(k));
    if(k && idx[COL[k]]==null) idx[COL[k]]=i;
  });
  if(idx.name==null) throw new Error("제품명 열을 매핑하지 못했습니다.");
  const out=[];
  for(let r=hi+1;r<rows.length;r++){
    const R=rows[r], g=k=>(idx[k]!=null&&R[idx[k]]!=null)?String(R[idx[k]]).trim():"";
    const name=g("name"); if(!name) continue;
    if(!/^\d+$/.test(g("no"))) continue;                    // 번호 없는 줄 = 데이터 행 아님
    const code=g("code"), ptype=g("ptype"), maker=g("maker");
    out.push({
      key:"S"+g("no"), src:"sheet", no:Number(g("no")),
      code:code||null, name, brand:g("brand")||"미정", ptype:ptype||null,
      pack:g("pack")||null, unitWeight:g("unitWeight")||null, spec:g("spec")||null,
      dose:g("dose")||null, ingr:g("ingr")||null, func:g("func")||null,
      shelf:g("shelf")||null, maker:maker||null, note:g("note")||null,
      market:ptype==="Dietary Supplement"?"수출":"국내",
      stage:code?"판매 중":"출시 준비(품번 미발행)",
      status1:code?"판매 중":"진행 중",
      status2:code?"판매 중":"출시 준비(품번 미발행)",
      owners:[], makers:(maker&&maker!=="미정")?[maker]:[], classes:[],
      start:null,target:null,nextCheck:null,end:null,
      notionUrl:null, drive:null, edited:null, pharmacist:null, po:null
    });
  }
  if(!out.length) throw new Error("CSV에서 유효한 제품 행을 찾지 못했습니다.");
  return out;
}
/* 여러 엔드포인트를 순차 시도 → 먼저 성공하는 것을 사용 */
async function querySheet(){
  const C=SHEET_CONFIG, errs=[];
  const tryUrl=async(u,label)=>{
    const r=await fetch(u,{cache:"no-store"});
    if(!r.ok) throw new Error(`${label} 응답 ${r.status}`);
    const txt=await r.text();
    if(/<html/i.test(txt.slice(0,400))) throw new Error(`${label}: CSV 대신 HTML 반환(권한 확인 필요)`);
    const items=sheetRowsToItems(parseCSV(txt));
    SHEET_CONFIG._via=label;
    return items;
  };
  for(let i=0;i<C.endpoints.length;i++){
    const label=i===0&&C.csvUrl?"웹게시 CSV":(C.endpoints[i].includes("gviz")?"gviz":"export");
    try{ return await tryUrl(C.endpoints[i],label) }catch(e){ errs.push(e.message) }
  }
  /* 브라우저에서 모두 막히면 로컬 릴레이로 우회 */
  if(C.relayUrl){
    try{
      const r=await fetch(C.relayUrl,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({sheetId:C.sheetId,gid:C.gid})});
      if(r.ok){ const d=await r.json();
        if(d.csv){ SHEET_CONFIG._via="릴레이"; return sheetRowsToItems(parseCSV(d.csv)) } }
    }catch(e){ errs.push("릴레이: "+e.message) }
  }
  throw new Error(errs[0]||"스프레드시트를 불러오지 못했습니다.");
}
/* 스프레드시트 품목 교체 (Notion 개발 품목은 유지) */
function applySheet(fresh){
  const notion=DB.items.filter(i=>i.src==="notion");
  DB.items=[...fresh,...notion];
  normalizeItems(DB.items); pruneGhosts(); reindex();
}
function normName(s){return String(s||"").toLowerCase().replace(/[\s()·\-&,\.]|파이토알엑스|phytorx/g,"")}
function applyNotion(fresh){
  /* 신규 DB 에 없는 값(시작일)과, DB 복제로 오늘 날짜가 찍히는 최초등록일은
     기존 스냅샷 값을 승계합니다. 승계하지 않으면 타임라인이 비고  NEW 가 오작동합니다. */
  const prev={};
  DB.items.forEach(i=>{ if(i.src!=="sheet") prev[i.key]=i; });
  fresh.forEach(n=>{
    const o=prev[n.key]; if(!o) return;
    if(!n.start   && o.start)   n.start=o.start;
    if(!n.target  && o.target)  n.target=o.target;
    if(o.created && (!n.created || n.created>o.created)) n.created=o.created;
  });
  const sheet=DB.items.filter(i=>i.src!=="notion");
  sheet.forEach(s=>{ if(s.src==="both"){ s.src="sheet"; s.notionUrl=null; s.owners=[];
    s.start=s.target=s.end=s.nextCheck=s.edited=null; delete s.devName } });
  const byN={}; sheet.forEach(s=>byN[normName(s.name)]=s);
  const add=[];
  fresh.forEach(n=>{
    const hit=byN[normName(n.name)];
    if(hit&&n.status1==="완료"){
      hit.src="both"; hit.notionUrl=n.notionUrl; hit.drive=n.drive||hit.drive;
      hit.owners=n.owners; hit.start=n.start||hit.start; hit.target=n.target||hit.target;
      hit.end=n.end; hit.nextCheck=n.nextCheck; hit.edited=n.edited; hit.devName=n.name;
      hit.created=n.created||hit.created;
    } else add.push(n);
  });
  DB.items=[...sheet,...add];
  normalizeItems(DB.items); reindex();
}

function openSpec(key){

  if(!isValid(r)){ toast("표시할 정보가 없는 항목입니다 (원본에 데이터 미입력)"); return }
  if(curView==="dev" && r.src!=="sheet") return openNotionSpec(r);
  openSheetSpec(r);
}

/* ═══ 원산지 구분 (국내 / 해외·수입) ═══
   판정 우선순위
      제품유형이 Dietary Supplement        → 해외
      제조원이 해외 업체                    → 해외
      영문 제품명 + 품번 미발행             → 해외
   라이브 시트에서 일부 열이 비어 있어도 걸리도록 3중으로 둡니다. */
const OVERSEAS_MAKERS=["us pharmatech","neeyaan","kyowa hakko"];
function isOverseas(it){
  if(!it) return false;
  if(it.isOverseas!=null) return !!it.isOverseas;          // 스냅샷에 값이 있으면 그대로
  if((it.ptype||"")==="Dietary Supplement") return true;
  const m=(it.maker||"").toLowerCase();
  if(OVERSEAS_MAKERS.some(x=>m.includes(x))) return true;
  const nm=it.name||"";
  if(nm && !/[가-힣]/.test(nm) && !it.code) return true;
  return false;
}
/* 동기화로 새로 들어온 품목에도 속성 부여 */
function tagOrigin(items){
  items.forEach(it=>{
    if(it.src==="notion"){ it.isOverseas=false }
    else if(it.isOverseas==null){ it.isOverseas=isOverseas(it) }
    it.origin=it.isOverseas?"overseas":"domestic";
  });
}
const ORIGIN_TABS=[
  {k:"all",      t:"전체"},
  {k:"domestic", t:"국내"},
  {k:"overseas", t:"해외"}
];
let originF="all";
const matchOrigin=it=>originF==="all"||it.origin===originF;

const ALL="__ALL__";
let kpiF=null,srcF="",gMode="month",devMode="kb",poMode="list",curView="dev",selBrand=null;
let bdSortK="name",bdSortD=1,poSortK="date",poSortD=-1,ppSortK="qty",ppSortD=-1;
const F={brand:"",type:"",owner:"",stage:"",q:"",match:""};
function scopeItems(){ return DB.items.filter(curView==="dev"?inDevView:inSpecView) }
function buildSelects(){
  const IT=curView==="po"?DB.items:scopeItems(), keep={...F};
  const MAP={fBrand:"brand",fType:"type",fOwner:"owner",fStage:"stage"};
  const fill=(id,o,lb,cur)=>{
    $(id).innerHTML=`<option value="">${lb}</option>`+o.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
    $(id).value=(cur&&o.includes(cur))?cur:"";
    if(!$(id).value) F[MAP[id.slice(1)]]="";
  };
  fill("#fBrand",uniq(IT.map(i=>i.brand)),"전체 브랜드",keep.brand);
  fill("#fType", uniq(IT.map(i=>i.ptype)),"전체 유형",keep.type);
  fill("#fOwner",uniq(IT.flatMap(i=>i.owners)),"전체 담당자",keep.owner);
  fill("#fStage",uniq(IT.map(i=>i.status2)),"전체 진행 상태",keep.stage);
}
function flt(){
  const q=F.q.trim().toLowerCase();
  return scopeItems().filter(it=>{
    if(F.brand&&it.brand!==F.brand) return false;
    if(F.type&&it.ptype!==F.type) return false;
    if(F.owner&&!it.owners.includes(F.owner)) return false;
    if(F.stage&&it.status2!==F.stage) return false;
    if(q){
      /* 검색 대상 : 제품명 · 원료(기능성성분) 중심. 품번(code)은 제외합니다. */
      const hay=[it.name,it.devName,it.brand,it.ptype,it.maker,it.ingr,it.func,it.note,it.status2,...it.owners].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(curView==="spec"&&!matchOrigin(it)) return false;
    if(srcF==="prog"&&!isDev(it)) return false;
    if(srcF==="risk"&&!hasIssue(it)) return false;
    if(kpiF){
      if(kpiF==="risk"&&!hasIssue(it)) return false;
      if(["plan","dev","mass"].includes(kpiF)&&stageOf(it.status2).kpi!==kpiF) return false;
    }
    return true;
  });
}
function fltOrders(){
  const q=F.q.trim().toLowerCase();
  return recentOrders().filter(o=>{
    if(F.match&&o.match!==F.match) return false;
    if(F.owner&&o.author!==F.owner) return false;
    if(q&&![o.product,o.vendor,o.matchName,o.author,o.kind].join(" ").toLowerCase().includes(q)) return false;
    if(F.brand){ const t=o.matchKey?BY_KEY[o.matchKey]:null; if(!t||t.brand!==F.brand) return false }
    return true;
  });
}

/* 상단 요약 카드 없음 — 프로세스 스테퍼의 단계별 건수만 갱신 */
function renderDevKpi(rows){

const kOpen={};
/* 담당자별 파스텔 태그 색 (결정적 배정) */
const OWN_TONE=["blue","purple","green","orange","cyan","yellow"];
const _ot={};
function ownTone(o){ if(!o) return "gray";
  if(!(o in _ot)) _ot[o]=OWN_TONE[Object.keys(_ot).length%OWN_TONE.length];
  return _ot[o] }
let showDone={};                                   /* 카테고리별 '완료·비활성 포함' 토글 */
let hideEmpty=false;                               /* 비어 있는 카테고리 접기 */
/* ═══ 카테고리 3단 섹션 렌더 ═══
   섹션 = 신제품 / 리뉴얼 / 제조사 이관 (세로 나열)
   표기 속성 6종 : 이름 · 진행 상태 · 담당자 · 유형 · 제조사 · 입고 목표일 */
const CATCOLS=[{k:"name",t:"이름"},{k:"status",t:"진행 상태"},{k:"owner",t:"담당자"},
               {k:"ptype",t:"유형"},{k:"maker",t:"제조사"},{k:"target",t:"입고 목표일"}];
function catRow(r){

  const dim=isDone(r)||isIdle(r);

function renderCats(rows){
  const groups=CATS.map(c=>{
    const all=rows.filter(r=>catOf(r)===c.k);
    return {c, act:all.filter(isActive), rest:all.filter(r=>!isActive(r)), all};
  });
  const nEmpty=groups.filter(g=>!g.all.length).length;
  const tb=$("#kbToggle");
  if(tb){ tb.innerHTML=nEmpty?`${hideEmpty?"빈 카테고리 표시":"빈 카테고리 숨기기"} <b>${nEmpty}</b>`:"";
          tb.style.display=nEmpty?"":"none"; }
  const shown=hideEmpty?groups.filter(g=>g.all.length):groups;

  $("#cats").innerHTML=shown.map(({c,act,rest,all})=>{
    const open=!!showDone[c.k];
    const list=open?[...act,...rest]:act;
    const body=list.length
      ? list.map(catRow).join("")
      : `<tr><td class="cempty" colspan="${CATCOLS.length}">${
            all.length?`진행 중인 품목이 없습니다 (완료·비활성 ${rest.length}건)`
                      :"해당 품목이 없습니다"}</td></tr>`;
    return `<section class="cat">
      <div class="cath">
        <h4>${c.t}<span class="cen">${c.en}</span></h4>
        <span class="cnt">${act.length}</span>

      </div>
      <div class="ts cts"><table>
        <thead><tr>${CATCOLS.map(x=>`<th class="${x.k==="target"?"num":""}">${x.t}</th>`).join("")}</tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </section>`;
  }).join("");

  $$("#cats [data-cd]").forEach(b=>b.addEventListener("click",()=>{
    showDone[b.dataset.cd]=!showDone[b.dataset.cd]; renderCats(flt());
  }));
  $$("#cats [data-spec]").forEach(b=>b.addEventListener("click",()=>openSpec(b.dataset.spec)));

/* ★ 버그 수정 : 일정이 없거나 과거에 끝난 품목도 행을 만들어 전부 노출 */
function renderGantt(rows){
  const g=$("#gantt"), eo=r=>r.end||r.target||r.nextCheck||TSTR;
  /* 시작일이 있는 품목 = 기간 바 */
  const onTL=r=>!!(r.start&&new Date(eo(r))>=Q_START);
  /* 시작일은 없지만 목표일·확인예정일이 앞으로 남은 품목 = 마일스톤만 표시
     (팀에서 목표일만 먼저 입력하는 경우가 많아 '일정 미입력'으로 묻히지 않게 함) */
  const onlyTarget=r=>!r.start && !!(r.target||r.nextCheck)
                      && new Date(r.target||r.nextCheck)>=Q_START;
  const dated=rows.filter(onTL);
  const msOnly=rows.filter(r=>!onTL(r)&&onlyTarget(r));
  const others=rows.filter(r=>!onTL(r)&&!onlyTarget(r));
  const qLbl=qLabel(Q_START);
  $("#gRange").innerHTML=`<b>${qLbl}</b> ~ · 전체 ${rows.length} · 일정 ${dated.length}`
    +(msOnly.length?` · 목표일만 ${msOnly.length}`:"")+` · 미입력 ${others.length}`;
  if(!rows.length){ g.innerHTML=`<div class="mt">조건에 맞는 품목이 없습니다.</div>`; return }

  const maxD=new Date(Math.max(...dated.map(r=>+new Date(eo(r))),
                               ...msOnly.map(r=>+new Date(r.target||r.nextCheck)),+TODAY));
  const endQ=new Date(Math.max(+UD(maxD.getUTCFullYear(),Math.floor(maxD.getUTCMonth()/3)*3+3),
                               +UD(Q_START.getUTCFullYear(),Q_START.getUTCMonth()+12)));
  const months=[];let c=Q_START;
  while(c<endQ){const nx=UD(c.getUTCFullYear(),c.getUTCMonth()+1);months.push({s:c,e:nx});c=nx}
  const cells=gMode==="month"?months:(()=>{const q=[];let d=Q_START;
    while(d<endQ){const nx=UD(d.getUTCFullYear(),d.getUTCMonth()+3);q.push({s:d,e:nx});d=nx}return q})();
  const T0=+cells[0].s,T1=+cells[cells.length-1].e;
  const pc=d=>Math.max(0,Math.min(100,((+new Date(d))-T0)/(T1-T0)*100));
  const tdp=pc(TODAY), curQ=qLabel(TODAY);
  let head;
  if(gMode==="month"){
    const qs=[];months.forEach(m=>{const k=qLabel(m.s);
      if(qs.length&&qs[qs.length-1].k===k)qs[qs.length-1].n++;else qs.push({k,n:1})});
    head=`<div class="grow"><div class="glbl hd" style="border-bottom:1px solid var(--bd)"></div><div class="gtrk">`
      +qs.map(q=>`<div class="gq ${q.k===curQ?"now":""}" style="flex:${q.n}">${q.k}</div>`).join("")+`</div></div>`
      +`<div class="grow"><div class="glbl hd">품목 / 담당 · 단계</div><div class="gtrk">`
      +months.map(m=>`<div class="gm">${m.s.getUTCMonth()+1}월</div>`).join("")
      +`<div class="gtd" style="left:${tdp}%"></div></div></div>`;
  } else {
    head=`<div class="grow"><div class="glbl hd">품목 / 담당 · 단계</div><div class="gtrk">`
      +cells.map(q=>`<div class="gq ${qLabel(q.s)===curQ?"now":""}">${qLabel(q.s)}</div>`).join("")
      +`<div class="gtd" style="left:${tdp}%"></div></div></div>`;
  }
  const lines=cells.map((x,i)=>i===0?"":`<div class="gl ${gMode==="month"&&x.s.getUTCMonth()%3===0?"q":""}" style="left:${pc(x.s)}%"></div>`).join("");

  const lbl_=r=>{
    const st=stageOf(r.status2), sn=stepNo(r), o=r.owners[0];
    return `<div class="glbl">
      <div class="gnm" data-spec="${esc(r.key)}">${esc(r.name)}${newTag(r)}</div>
      <div class="gmt">${esc(o||"미지정")} · <span style="color:${st.c}">${st.e} ${esc(r.status2)}</span>${sn?` · ${sn}/13`:""}</div>
    </div>`;
  };
  dated.sort((a,b)=>new Date(a.start)-new Date(b.start));
  const rowsHtml = dated.map(r=>{
    const st=stageOf(r.status2),late=isLate(r),dim=HOLD(r),sn=stepNo(r);
    const clip=new Date(r.start)<Q_START;
    const L=pc(clip?Q_START:r.start), R=pc(eo(r)), W=Math.max(R-L,2.2);
    const t=`${clip?"…":fd(r.start)} → ${fd(eo(r))}`;
    return `<div class="grow">${lbl_(r)}
      <div class="gtrk bd">${lines}<div class="gtd" style="left:${tdp}%"></div>
        <div class="gbar ${late?"late":""} ${dim?"dim":""} ${clip?"clip":""}" data-spec="${esc(r.key)}"
             style="left:${L}%;width:${W}%;background:${dim?"var(--s4)":st.c};color:${dim?"var(--tx2)":"#fff"}"
             title="${esc(r.name)} · ${t}${sn?" · 현재 "+sn+"단계":""}">
          ${sn?`<span class="gstep" style="color:${st.c}">${sn}</span>`:""}
          <span class="lbl" style="margin-left:${sn?"19px":"0"}">${W>14?t:""}</span>
        </div>
        ${r.target&&new Date(r.target)>=Q_START?`<div class="gms" style="left:calc(${pc(r.target)}% - 5px)" title="입고 목표일 ${r.target}"></div>`:""}
      </div></div>`;
  }).join("")
  + msOnly.map(r=>{
    const st=stageOf(r.status2), sn=stepNo(r), late=isLate(r);
    const d=r.target||r.nextCheck, lbl=r.target?"입고 목표":"확인 예정";
    return `<div class="grow">${lbl_(r)}
      <div class="gtrk bd">${lines}<div class="gtd" style="left:${tdp}%"></div>
        <div class="gms big ${late?"late":""}" data-spec="${esc(r.key)}"
             style="left:calc(${pc(d)}% - 7px);background:${st.c}" title="${esc(r.name)} · ${lbl} ${d}"></div>
        <div class="gmslbl" data-spec="${esc(r.key)}" style="left:calc(${pc(d)}% + 12px);color:${st.c}">
          ${sn?`<span class="stepdot">${sn}/13</span>`:""}${lbl} ${fd(d)}</div>
      </div></div>`;
  }).join("")
  + others.map(r=>{
    const sn=stepNo(r), why=r.start?`과거 종료 (${fd(r.start)} → ${fd(eo(r))})`:"일정 미입력 — Notion에 시작일·목표일 등록 필요";
    return `<div class="grow">${lbl_(r)}
      <div class="gtrk bd">${lines}<div class="gtd" style="left:${tdp}%"></div>
        <div class="gph" data-spec="${esc(r.key)}" title="${esc(r.name)} · ${why}">
          ${sn?`<span class="stepdot">${sn}/13</span>`:""}${esc(r.start?"과거 종료":"일정 미입력")}</div>
      </div></div>`;
  }).join("");
  g.innerHTML=`<div class="ghead">${head}</div><div class="gbody">${rowsHtml}</div>`;
}

function renderSpecKpi(rows){

/* 탭 카운트는 원산지 외 조건만 적용한 집합에서 집계 */
function renderOriginTabs(){
  const base=DB.items.filter(it=>{
    if(!inSpecView(it)) return false;
    const q=F.q.trim().toLowerCase();
    if(F.brand&&it.brand!==F.brand) return false;
    if(F.type&&it.ptype!==F.type) return false;
    if(q){
      /* 원산지 탭 카운트도 본 목록과 동일 조건 — 품번(code) 제외 */
      const hay=[it.name,it.devName,it.brand,it.ptype,it.maker,it.ingr,it.func,it.note,it.status2].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const c={all:base.length,
    domestic:base.filter(i=>i.origin==="domestic").length,
    overseas:base.filter(i=>i.origin==="overseas").length};
  $("#otabs").innerHTML=ORIGIN_TABS.map(t=>
    `<button role="tab" aria-selected="${originF===t.k}" class="${originF===t.k?"on":""}" data-og="${t.k}">
       ${t.t}<span class="oc">${c[t.k]}</span></button>`).join("");
  $$("#otabs button").forEach(b=>b.addEventListener("click",()=>{
    if(originF===b.dataset.og) return;
    originF=b.dataset.og;
    selBrand=null; $("#bdet").classList.remove("on");   // 구분 변경 시 펼친 상세는 닫음
    render();
  }));
}
function renderBrandGrid(rows){

  const bs=Object.entries(bm).sort((a,b)=>b[1].length-a[1].length);
  if(!bs.length){ $("#bgrid").innerHTML=`<div class="mt" style="grid-column:1/-1">조건에 맞는 품목이 없습니다.</div>`; return }
  $("#bgrid").innerHTML=
    `<button class="bcard all ${selBrand===ALL?"sel":""}" data-brand="${ALL}">
      <div class="bn">전체 브랜드</div>
      <div class="bc">${rows.length}개 품목</div>
      <div class="barr">→</div></button>`
    /* 카드에는 브랜드명 · 총 품목 수 · 화살표만 노출 (유형/발주 태그 제거) */
    + bs.map(([b,list])=>
      `<button class="bcard ${selBrand===b?"sel":""}" data-brand="${esc(b)}" style="background:${brandColor(b).g}">

        <div class="bc">${list.length}개 품목</div>

  $$("#bgrid .bcard").forEach(el=>el.addEventListener("click",()=>{

/* 요청 규격 : 제품명 · 제품유형 · 포장단위 · 단위중량 · 소비기한 · 제조원 (6열) */
const BDCOLS=[{k:"name",t:"제품명",c:"nm"},{k:"ptype",t:"제품유형"},{k:"pack",t:"포장단위"},
  {k:"unitWeight",t:"단위중량"},{k:"shelf",t:"소비기한"},{k:"maker",t:"제조원"}];
function renderBrandDetail(rows){
  const isAll=(selBrand===ALL||selBrand===null);
  const list=isAll?rows:rows.filter(r=>r.brand===selBrand);
  const label=isAll?"전체 브랜드":selBrand;
  const col=isAll?{g:"linear-gradient(140deg,#5b6480,#404859)"}:brandColor(selBrand);

  const gv=(r,k)=>Array.isArray(r[k])?r[k].join(", "):(r[k]??"");
  const S=[...list].sort((a,b)=>{const A=gv(a,bdSortK),B=gv(b,bdSortK);
    if(typeof A==="number"&&typeof B==="number") return (A-B)*bdSortD;

    return String(A).localeCompare(String(B),"ko")*bdSortD});
  $("#bdEmpty").style.display=S.length?"none":"block";
  $("#bdTb").innerHTML=S.map(r=>`<tr>
      <td class="nm"><button class="lk2" type="button" data-spec="${esc(r.key)}" title="스펙 상세 보기">${esc(r.name)}</button>${newTag(r)}</td>

/* ═══════ 오케스트레이션 ═══════ */
const VMETA={dev:{t:"제품 개발 현황"},po:{t:"발주 현황"},spec:{t:"제품 정보 라이브러리"}};
function render(){ try{ render_(); }catch(e){
    console.error(e);
    toast("화면 렌더 중 오류: "+e.message,"err");
  } }
function render_(){
  if(curView==="po"){
    const os=fltOrders();
    $("#rcNow").textContent=os.length; $("#rcAll").textContent=DB.orders.length;
  }else{
    const rows=flt(), scope=scopeItems();
    $("#rcNow").textContent=rows.length; $("#rcAll").textContent=scope.length;
  }
  const N={plan:"기획/검토",dev:"개발/샘플",mass:"양산/출시 대기",risk:"지연·이슈"};
  $("#rcNote").textContent=kpiF?` · KPI: ${N[kpiF]}`:"";
  /* 적용 중인 필터 개수 = 검색어·드롭다운·세그먼트·KPI·원산지 탭 전부 합산 */
  const cnt=Object.values(F).filter(Boolean).length+(srcF?1:0)+(kpiF?1:0)
          +((curView==="spec"&&originF!=="all")?1:0)+(selBrand?1:0);
  $("#fCnt").textContent=cnt?`적용 ${cnt}건`:"";
  const rb=$("#reset");
  if(rb){
    rb.classList.toggle("idle",!cnt); rb.classList.toggle("act",!!cnt);
    rb.disabled=!cnt;
    const fb=$("#fBadge"); if(fb) fb.textContent=cnt;
  }
  $("#ncDev").textContent=DB.items.filter(inDevView).length;
  $("#ncSpec").textContent=DB.items.filter(inSpecView).length;
  $("#ncPo").textContent=recentOrders().length;
  refreshSrc();
  if(curView==="dev"){ const rows=flt(); renderDevKpi(rows); renderCats(rows); renderGantt(rows) }
  else if(curView==="po"){ renderPo() }
  else{ const rows=flt(); renderOriginTabs(); renderSpecKpi(rows); renderBrandGrid(rows);
        if(selBrand!==null||$("#bdet").classList.contains("on")) renderBrandDetail(rows) }
}
function goView(v){
  curView=v; selBrand=null; kpiF=null; srcF=""; F.match=""; originF="all";
  $("#bdet").classList.remove("on"); $("#fMatch").value="";
  $$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $$(".view").forEach(s=>s.classList.remove("on"));
  $("#v-"+v).classList.add("on");
  $("#vTitle").textContent=VMETA[v].t;
  $$(".kpi").forEach(e=>e.classList.remove("active"));
  $$("#segSrc button").forEach((b,i)=>b.classList.toggle("on",i===0));
  const dev=v==="dev", po=v==="po";
  $("#wOwner").classList.toggle("hide",!(dev||po));
  $("#wStage").classList.toggle("hide",!dev);
  $("#wType").classList.toggle("hide",po);
  $("#wMatch").classList.toggle("hide",!po);
  $("#segSrc").classList.toggle("hide",!dev);
  buildSelects(); render();
  if(window.innerWidth<=1080) $("#sb").classList.remove("open");
}
(function bind(){
  const M={fBrand:"brand",fType:"type",fOwner:"owner",fStage:"stage",fMatch:"match"};
  Object.entries(M).forEach(([id,k])=>$("#"+id).addEventListener("change",e=>{F[k]=e.target.value;render()}));
  /* 로고 클릭 → 대시보드 홈(초기 상태)으로 */
  $("#homeBtn").addEventListener("click",()=>{ goView("dev"); toast("대시보드 홈으로 초기화했습니다") });
  /* 검색창 : 300ms 디바운스 — 타이핑이 멈춘 뒤 한 번만 필터링 */
  let t;$("#fQ").addEventListener("input",e=>{clearTimeout(t);t=setTimeout(()=>{F.q=e.target.value;render()},300)});
  $("#reset").addEventListener("click",()=>{
    Object.keys(F).forEach(k=>F[k]="");Object.keys(M).forEach(id=>$("#"+id).value="");
    $("#fQ").value="";kpiF=null;srcF="";selBrand=null;originF="all";$("#bdet").classList.remove("on");
    $$(".kpi").forEach(e=>e.classList.remove("active"));
    $$("#segSrc button").forEach((b,i)=>b.classList.toggle("on",i===0));
    render();
  });
  $$(".kpi:not(.static)").forEach(el=>el.addEventListener("click",()=>{
    const k=el.dataset.k; kpiF=(kpiF===k||k==="all")?null:k;
    $$(".kpi").forEach(e=>e.classList.toggle("active",e.dataset.k===kpiF)); render();
  }));
  $$("#segSrc button").forEach(b=>b.addEventListener("click",()=>{
    srcF=b.dataset.s;$$("#segSrc button").forEach(x=>x.classList.toggle("on",x===b));render();
  }));
  $$("#nav button").forEach(b=>b.addEventListener("click",()=>goView(b.dataset.v)));
  $$("#devMode button").forEach(b=>b.addEventListener("click",()=>{
    devMode=b.dataset.m;
    $$("#devMode button").forEach(x=>x.classList.toggle("on",x===b));
    $("#devKb").style.display=devMode==="kb"?"":"none";
    $("#devGt").style.display=devMode==="gt"?"":"none";
    $("#devPanelT").textContent=devMode==="kb"?"상태별 진행 보드":"개발 일정 타임라인";
  }));
  $("#kbToggle").addEventListener("click",()=>{hideEmpty=!hideEmpty;renderCats(flt())});
  $$("#poMode button").forEach(b=>b.addEventListener("click",()=>{
    poMode=b.dataset.m; $$("#poMode button").forEach(x=>x.classList.toggle("on",x===b)); renderPo();
  }));
  $("#gM").addEventListener("click",()=>{gMode="month";$("#gM").classList.add("on");$("#gQ").classList.remove("on");renderGantt(flt())});
  $("#gQ").addEventListener("click",()=>{gMode="quarter";$("#gQ").classList.add("on");$("#gM").classList.remove("on");renderGantt(flt())});
  $("#themeBtn").addEventListener("click",()=>{
    const p=document.documentElement.dataset.theme==="light";
    document.documentElement.dataset.theme=p?"dusk":"light";
    $("#themeBtn").title=p?"라이트 모드로 전환":"더스크 모드로 전환";
  });
  $("#autoBtn").addEventListener("click",()=>{
    autoOn=!autoOn;
    $("#autoBtn").classList.toggle("off",!autoOn);
    $("#autoBtn").title=autoOn?"자동 동기화 끄기":"자동 동기화 켜기";
    if(autoOn) autoLeft=NOTION_CONFIG.autoSyncMin*60;
    toast(autoOn?`자동 동기화 ON (${NOTION_CONFIG.autoSyncMin}분)`:"자동 동기화 OFF");
  });
  $("#sbTg").addEventListener("click",()=>$("#sb").classList.toggle("open"));
})();

window.addEventListener("error",e=>{
  console.error(e.error||e.message);
  try{ toast(" 스크립트 오류: "+(e.message||"unknown"),"err") }catch(_){}
});
goView("dev"); refreshSrc(); paintSyncBar(null);
if(SHEET_CONFIG.csvUrl||NOTION_CONFIG.relayUrl||NOTION_CONFIG.apiKey||SLACK_CONFIG.relayUrl||SLACK_CONFIG.botToken)
  setTimeout(()=>syncAll(true),700);
</script>
</body>
</html>
